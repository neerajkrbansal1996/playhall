name: playhall

services:
  postgres:
    image: postgres:16-alpine
    container_name: playhall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: playhall
      POSTGRES_PASSWORD: playhall
      POSTGRES_DB: playhall
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U playhall -d playhall']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: playhall-redis
    restart: unless-stopped
    # Live room state is authoritative in Redis between snapshots, so eviction
    # must never silently drop a room: fail writes instead of evicting keys.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
