name: playhall

services:
  postgres:
    image: postgres:16-alpine
    container_name: playhall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: playhall
      POSTGRES_PASSWORD: playhall
      POSTGRES_DB: playhall
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U playhall -d playhall']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: playhall-redis
    restart: unless-stopped
    # Redis is a cache, never the tier of record (ADR-0001 §6.1): a lost keyspace
    # costs a rehydrate from the Postgres match log, never a match. These flags are
    # belt-and-braces to keep local dev quiet, NOT a correctness dependency — do not
    # reintroduce one, and do not treat a managed tier lacking them as disqualified.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
