name: Setup Node and pnpm
description: >-
  Installs the pnpm/Node versions this repo pins and restores the pnpm store
  cache. Every CI job goes through here so the toolchain is defined once.

inputs:
  install:
    description: Run `pnpm install --frozen-lockfile`. Set to "false" for jobs that only need the checkout.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # `packageManager` in the root package.json is the single source of truth for
    # the pnpm version, so there is nothing to keep in sync here.
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    # `.nvmrc` is the single source of truth for the Node version.
    - name: Install Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
