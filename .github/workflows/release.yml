name: Release

# Production deploys. Tag-triggered, never branch-triggered.
#
# ADR-0004 §Decision 5: releases are cut from tags, never from "whatever is on
# `main`". `main` cannot be protected on this GitHub plan, so an unreviewed
# commit *can* land there — the tag is what stops it becoming production. A
# human cutting `vX.Y.Z` is the gate that branch protection would otherwise be.
#
# The gates re-run here too. A tag can point at any commit, including one that
# never saw `main`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or SHA to deploy. Must already be tagged for a real release.
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gates:
    name: gates
    uses: ./.github/workflows/ci.yml

  web:
    name: deploy web
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The GitHub Environment holds the production secrets and is where a
    # required reviewer can be attached later — the one approval gate that does
    # not need branch protection.
    environment:
      name: production-web
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - id: deploy
        uses: ./.github/actions/deploy
        with:
          environment: production
          target: web
          health-path: /api/health
          provider: ${{ vars.DEPLOY_PROVIDER }}
          probe-attempts: '30'

  realtime:
    name: deploy realtime
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production-realtime
      url: ${{ steps.deploy.outputs.url }}
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - id: deploy
        uses: ./.github/actions/deploy
        with:
          environment: production
          target: realtime
          health-path: /health
          # `apps/realtime` needs a persistent-process host, so it is almost
          # certainly a different provider from web (ADR-0003 §8). Its own
          # variable keeps that possible.
          provider: ${{ vars.REALTIME_DEPLOY_PROVIDER || vars.DEPLOY_PROVIDER }}
          probe-attempts: '30'
