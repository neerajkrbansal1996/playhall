name: CI

# Design note (PER-6): branch protection cannot be enabled on this repo yet
# (private repo on the current GitHub plan — see docs/ci-cd.md). So the pipeline
# is built so that turning protection on later is a settings change, not a
# workflow rewrite:
#
#   * `ci-gate` is the single aggregate job. Require that one check and every
#     gate below becomes required transitively. Adding or renaming a gate never
#     changes the required-check list.
#   * `merge_group` is already a trigger, so a merge queue can be switched on
#     with no edit here.
#   * Every gate runs through `scripts/ci/gate.mjs`, so a gate whose
#     implementation has not landed yet reports PENDING instead of erroring on a
#     missing pnpm script.

on:
  # `edited` is load-bearing, not tidiness (PER-117). A bare `pull_request:`
  # defaults to `[opened, synchronize, reopened]`, and `pr-hygiene` is the one
  # gate that reads PR *metadata* instead of the tree — so without `edited` it
  # checks the title and body exactly once and never looks again. A PR could
  # open with a `Paperclip-Issue:` trailer, go green, and then have the link
  # edited out; worse, `pr-hygiene` checks the title because a squash-merge
  # takes the PR title as the commit subject, so a retitle after the gate
  # passed lands an unchecked subject on `main` and breaks the CHANGELOG.
  # `gh run rerun` is not a workaround — a rerun replays the *stored* event
  # payload, so it re-reads the old body.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
  workflow_dispatch:
  # `production.yml` calls this on every push to `main`, so the gates run
  # against the merge commit itself. There is deliberately no `push` trigger
  # here — it would double every `main` run and double the Actions minutes.
  workflow_call:

# One run per ref. A force-push supersedes the previous run instead of queueing
# behind it. `main` is never cancelled, so the production pipeline always has a
# completed CI run to gate on.
#
# `event.action` is in the group for the `edited` trigger above: an `edited` and
# a `synchronize` are both `event_name: pull_request`, so keying on the event
# name alone would put them in one group and `cancel-in-progress` would let a
# PR-body edit kill the in-flight code run and restart all of the gates.
# Splitting by action keeps the intent above — a force-push still supersedes the
# previous force-push — while a metadata edit only ever supersedes another edit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event.action }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  pr-hygiene:
    name: pr-hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linked issue and conventional PR title
        run: node scripts/ci/pr-hygiene.mjs

  # The one cross-file coupling in this pipeline, made checkable (PER-88).
  # `ci-gate` below requests `pull-requests: write`, and a `workflow_call` caller
  # that grants less does not fail a gate — GitHub rejects the whole run when it
  # builds it, with zero jobs, no annotation and no check run on the commit, so
  # nothing turns red. `main.yml` and `release.yml` now carry the grant, and both
  # say why, but a comment cannot catch the third caller or the next job here that
  # needs a new scope. This can.
  #
  # No `setup` step on purpose: it reads the workflow files off disk and runs no
  # install, so it is the cheapest job here and still reports when the workspace
  # would not install.
  #
  # `actionlint` (PER-101) joins the same job rather than getting its own: it is
  # the same subject — the workflow files themselves — and needs no install
  # either. Both checks run even if the first fails, so one bad workflow file does
  # not hide the other problem.
  #
  # actionlint's known blind spot: for `pull_request`, GitHub parses the head
  # ref's workflow files before it builds the run, so a syntax error in *this*
  # file startup_failures everything and this job never starts. It still covers
  # the other four workflows, and covers this one on `workflow_dispatch`.
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        env:
          # Pinned by version + checksum for the same reason every `uses:` here is
          # pinned by SHA: a CI linter that changes silently under you is a worse
          # failure than not having one.
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --strict -
          tar -xzf "$tarball" actionlint
          ./actionlint -color
      - name: Reusable-workflow callers are not narrowed
        if: always()
        run: node scripts/ci/assert-workflow-permissions.mjs

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: node scripts/ci/gate.mjs lint

  # Separate from `lint` so "your code is wrong" and "your code is unformatted"
  # are two different red X's. A formatting failure is fixed with `pnpm format`
  # and needs no thought; conflating the two trains people to skim both.
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: node scripts/ci/gate.mjs format

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: node scripts/ci/gate.mjs typecheck

  # Kept as its own job on purpose (ADR-0002): the boundary rule set is the
  # contract that makes "games are plugins" true, and its failure must be
  # readable on its own rather than buried in a lint log.
  boundaries:
    name: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: node scripts/ci/gate.mjs boundaries

  # The companion to `boundaries`, and deliberately separate from it (PER-126).
  # `boundaries` reads the *import graph*; this reads the *emitted bytes*. They
  # catch different regressions: a type-only import of a zod-backed module is a
  # graph edge that ships nothing, while a client component that *calls* something
  # zod-backed ships 79.6 kB through an import that is already legal — so there is
  # no new edge for dependency-cruiser to object to. Only a build can tell those
  # apart, so this is the job that runs `next build`.
  #
  # Deliberately NOT folded into `e2e`, even though `e2e`'s Playwright webServer
  # builds `apps/web` too and this duplicates that build (PER-126 review). Two
  # reasons: `e2e` is the long pole at ~2 min, so folding would delay the zod
  # verdict from +46 s to +2 min for no wall-clock saving (these run in parallel);
  # and `e2e`'s build does not set NEXT_PUBLIC_SETTINGS_FORM_PREVIEW=1, so
  # /dev/settings-form would be absent from the manifest and the gate would
  # hard-fail. Keeping the builds independent also stops a flaky browser test from
  # masking a bundle regression.
  bundle:
    name: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: node scripts/ci/gate.mjs bundle

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: node scripts/ci/gate.mjs unit

  # The repo-wide >= 80% rule (AGENTS.md) is currently enforced only *inside*
  # `pnpm test`, by each package's own vitest thresholds — so a package that
  # never configures a threshold is exempt by accident, which is how
  # `game-sdk` sat at 0% and `games/chess` at 41% while `unit` stayed green.
  # This gate is the aggregate check that closes that hole. PENDING until its
  # owning issue (PER-89) lands the root script; see scripts/ci/gate.mjs.
  #
  # The coverage artifact belongs here rather than on `unit`, where it used to
  # sit: `unit` runs vitest with no `--coverage`, so the upload had
  # `if-no-files-found: ignore` and published an empty archive on every run that
  # read, to anyone glancing at it, as coverage enforcement. On this job it is
  # empty for the same reason until PER-89 lands — but at least it is attached to
  # the job whose name says it is pending.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: node scripts/ci/gate.mjs coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            packages/*/coverage/**
            games/*/coverage/**
            games/_examples/*/coverage/**
          if-no-files-found: ignore
          retention-days: 7

  # The conformance suite. This is the gate that blocks a game from merging if
  # it leaks hidden information, is non-deterministic, or accepts an illegal
  # action. Separate from `unit` so a game author sees *which* contract broke.
  testkit:
    name: testkit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: node scripts/ci/gate.mjs testkit

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same images as docker-compose.yml, so "green locally" and "green in CI"
    # mean the same thing.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: playhall
          POSTGRES_PASSWORD: playhall
          POSTGRES_DB: playhall
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U playhall -d playhall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://playhall:playhall@localhost:5432/playhall
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: node scripts/ci/gate.mjs integration

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: playhall
          POSTGRES_PASSWORD: playhall
          POSTGRES_DB: playhall
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U playhall -d playhall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://playhall:playhall@localhost:5432/playhall
      REDIS_URL: redis://localhost:6379
      # Not `test`: the gate's `webServer` runs `next build`, and NODE_ENV=test
      # makes Next warn and can change which deps are available to the build.
      # Playwright's own env does not need it, and nothing in `e2e/` reads it.
      NODE_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # One install, two browsers (PER-131). `--with-deps` is the part that needs
      # to be a workflow step rather than living inside the pnpm script: it runs
      # `apt-get` for the shared libraries WebKit and Chromium need on a bare
      # ubuntu runner, which is a no-op on a developer's machine and wrong to run
      # there. The version comes from the lockfile, so the cache key cannot drift
      # from the Playwright that will use it — a stale key is how a suite ends up
      # silently downloading browsers on every run, or worse, running the wrong
      # ones.
      - name: Resolve the Playwright version
        id: playwright
        run: |
          set -euo pipefail
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        # On a cache hit the browsers are already there, but `--with-deps`
        # installs OS packages that are *not* in the cache path, so the deps half
        # always has to run.
        run: |
          set -euo pipefail
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium webkit
          else
            pnpm exec playwright install --with-deps chromium webkit
          fi

      - run: node scripts/ci/gate.mjs e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 7

  # THE required check. Require only this one in branch protection.
  #
  # `needs` + `always()` means this job runs even when a gate fails, and then
  # fails itself unless every gate it depends on succeeded. `pr-hygiene` may be
  # `skipped` because it does not run on push/merge_group; a `skipped` result
  # for any other job is treated as a failure, so a mistakenly conditioned job
  # cannot quietly stop gating.
  ci-gate:
    name: ci-gate
    if: always()
    needs:
      [
        pr-hygiene,
        workflows,
        lint,
        format,
        typecheck,
        boundaries,
        bundle,
        unit,
        coverage,
        testkit,
        integration,
        e2e,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Needed only to post the gate table on the PR (ADR-0004 Decision 2).
      # A called workflow cannot exceed its caller's grant, so `main.yml` and
      # `release.yml` must each grant `pull-requests: write` on the job that
      # calls this one. Both originally granted `contents: read` alone, and the
      # result was a run that failed at startup with zero jobs — no failed step
      # and no annotation to read. If you add another caller, grant it there too.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ADR-0004 Decision 2: make "green CI" observable in the PR itself. With
      # no required checks, a reviewer has to *choose* to look — so the result
      # goes where the review already is, not in the Actions tab.
      #
      # The body is rendered by `scripts/ci/gate-report.mjs` rather than inline
      # here (PER-236). The inline version was a near-copy of the table in
      # `assert-gates.mjs` and drifted from it in the way that mattered: both read
      # `needs.<job>.result` alone, which is `success` for a gate that ran and for
      # a PENDING placeholder that exited 0 without running anything, so
      # `coverage` rendered `✅ pass` under "All gates passed." One module now
      # renders both, and it recovers the PENDING state by re-deriving it from
      # this checkout's `package.json` — the same SHA every gate job read.
      #
      # `continue-on-error` on both halves, for the same reason the old single
      # step had it: reporting must never be what decides the build. `Assert
      # every gate passed` below is the verdict, and it reads the same module.
      - name: Render the gate table
        if: always() && github.event_name == 'pull_request'
        id: gate-table
        continue-on-error: true
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
          GATE_FULL_SHA: ${{ github.sha }}
          GATE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/gate-comment.md"
          # The comment heading wants the short SHA; Actions expressions cannot slice.
          GATE_SHA="${GATE_FULL_SHA:0:7}" node scripts/ci/gate-report.mjs --format=pr > "$body"
          cat "$body"

          # The marker is read back off the rendered body rather than repeated
          # here. It is what the next step matches on to update its own comment
          # instead of posting a new one, so a copy in this file that drifted from
          # `COMMENT_MARKER` in gate-report.mjs would silently start appending a
          # fresh table to every PR on every run. Renderer emits it first line.
          marker=$(head -n 1 "$body")
          case "$marker" in
            '<!--'*'-->') ;;
            *) echo "::error::gate-report.mjs did not emit a marker first; got: $marker" && exit 1 ;;
          esac
          echo "marker=$marker" >> "$GITHUB_OUTPUT"

      # Guarded on `outcome`, not `conclusion`: under `continue-on-error` the
      # render step's `conclusion` is always `success`, so only `outcome`
      # distinguishes a rendered body from a file that was never written. Without
      # it, a failed render would post the previous run's leftover file or crash
      # on a missing one.
      - name: Post the gate table on the PR
        if: always() && github.event_name == 'pull_request' && steps.gate-table.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GATE_MARKER: ${{ steps.gate-table.outputs.marker }}
        with:
          script: |
            const { readFileSync } = require('node:fs')
            const marker = process.env.GATE_MARKER
            const body = readFileSync(`${process.env.RUNNER_TEMP}/gate-comment.md`, 'utf8')

            const existing = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
            })
            const mine = existing.find((comment) => comment.body?.includes(marker))

            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              })
            }

      # Last step, so the comment above is posted even when the gates failed.
      - name: Assert every gate passed
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci/assert-gates.mjs
